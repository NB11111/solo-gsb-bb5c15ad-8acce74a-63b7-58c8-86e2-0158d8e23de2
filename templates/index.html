<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>编织说明逐行针数校验</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="container">
    <h1>编织说明逐行针数校验</h1>
    <p class="hint">
      支持记号：<code>k</code>（消耗1/产出1）、<code>p</code>（消耗1/产出1）、
      <code>yo</code>（消耗0/产出1）、<code>k2tog</code>（消耗2/产出1），
      以及可嵌套的 <code>(指令序列)*次数</code>，如 <code>((k yo)*2 k2tog)*3</code>。
      记号可用空格或逗号分隔，大小写不敏感。
    </p>

    <form id="check-form">
      <label class="field">
        <span>起针数</span>
        <input type="number" id="cast-on" min="1" step="1" value="12" required>
      </label>

      <label class="field">
        <span>每行指令（一行一条）</span>
        <textarea id="pattern" rows="8" spellcheck="false"
          placeholder="(k2tog yo)*6&#10;p*12&#10;(k2tog)*6"></textarea>
      </label>

      <div class="actions">
        <button type="submit">校验</button>
        <button type="button" id="fill-example">填入示例</button>
      </div>
    </form>

    <section id="result" hidden>
      <div id="summary"></div>
      <div id="error-box" class="error" hidden></div>
      <table id="rows-table" hidden>
        <thead>
          <tr>
            <th>行号</th>
            <th>指令</th>
            <th>入针（可用）</th>
            <th>消耗</th>
            <th>产出</th>
            <th>出针（剩余）</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
