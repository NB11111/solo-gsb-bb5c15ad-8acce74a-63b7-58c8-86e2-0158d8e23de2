<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>编织说明逐行针数校验</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="container">
    <h1>编织说明逐行针数校验</h1>
    <p class="hint">
      支持记号：<code>k</code>（消耗1/产出1）、<code>p</code>（消耗1/产出1）、
      <code>yo</code>（消耗0/产出1）、<code>k2tog</code>（消耗2/产出1），
      以及可嵌套的 <code>(指令序列)*次数</code>，如 <code>((k yo)*2 k2tog)*3</code>。
      记号可用空格或逗号分隔，大小写不敏感。
    </p>

    <div class="tabs">
      <button type="button" class="tab active" data-mode="single">单尺码校验</button>
      <button type="button" class="tab" data-mode="sizes">多尺码校验</button>
    </div>

    <!-- 单尺码 -->
    <form id="check-form" class="panel">
      <label class="field">
        <span>起针数</span>
        <input type="number" id="cast-on" min="1" step="1" value="12" required>
      </label>

      <label class="field">
        <span>每行指令（一行一条）</span>
        <textarea id="pattern" rows="8" spellcheck="false"
          placeholder="(k2tog yo)*6&#10;p*12&#10;(k2tog)*6"></textarea>
      </label>

      <div class="actions">
        <button type="submit">校验</button>
        <button type="button" id="fill-example">填入示例</button>
      </div>
    </form>

    <!-- 多尺码 -->
    <form id="sizes-form" class="panel" hidden>
      <div class="field">
        <span>尺码（按顺序输入尺码名与各自起针数）</span>
        <div id="size-rows"></div>
        <div class="actions">
          <button type="button" id="add-size" class="secondary">+ 添加尺码</button>
        </div>
      </div>

      <label class="field">
        <span>共用逐行指令（一行一条）</span>
        <textarea id="sizes-pattern" rows="8" spellcheck="false"></textarea>
        <small class="hint">
          多尺码倍数写成 <code>*{6|8|10}</code>，竖线分隔的正整数按尺码顺序分别取值；
          普通 <code>*n</code> 对所有尺码生效，两种重复可以嵌套，如
          <code>((k yo)*2 k2tog)*{2|3|4}</code>。
        </small>
      </label>

      <div class="actions">
        <button type="submit">校验全部尺码</button>
        <button type="button" id="fill-sizes-example">填入示例</button>
      </div>
    </form>

    <!-- 单尺码结果 -->
    <section id="result" class="panel" hidden>
      <div id="summary"></div>
      <div id="error-box" class="error" hidden></div>
      <table id="rows-table" hidden>
        <thead>
          <tr>
            <th>行号</th>
            <th>指令</th>
            <th>入针（可用）</th>
            <th>消耗</th>
            <th>产出</th>
            <th>出针（剩余）</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <!-- 多尺码结果 -->
    <section id="sizes-result" class="panel" hidden>
      <div id="sizes-summary"></div>
      <div id="sizes-request-error" class="error" hidden></div>
      <div id="size-cards" class="size-cards"></div>
    </section>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
